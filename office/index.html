<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Le Campus des Agents IA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Scène 3D plein écran ; fiche à droite, discussion en bas à gauche ; sur téléphone, un seul panneau à la fois en bas. */
:root{--nuit:#0d1322;--panneau:rgba(19,26,46,.95);--trait:#2c3558;--or:#c9a35c;--or-doux:#e9d3a3;--creme:#f3ece0;--gris:#9aa3bd;--vert:#5fcf96;--ambre:#f0b352;
  --titre:"Cormorant Garamond",Georgia,serif;--texte:"DM Sans",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--nuit);color:var(--creme);font:14.5px/1.45 var(--texte)}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl.main{cursor:pointer}
#hud{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.plaque{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:6px;background:rgba(20,24,34,.88);color:#fff;
  font:700 12px var(--texte);padding:4px 11px 4px 9px;border-radius:30px;white-space:nowrap;border:0}
.plaque i{width:7px;height:7px;border-radius:50%;background:var(--vert)}
.plaque.loisir{background:rgba(255,255,255,.85);color:#27324d}.plaque.loisir i{display:none}
.nom{position:absolute;transform:translate(-50%,-100%);display:flex;align-items:center;gap:5px;padding:2px 9px 2px 7px;border-radius:20px;background:rgba(13,19,34,.82);font-size:11.5px;font-weight:700;white-space:nowrap}
.nom i{width:7px;height:7px;border-radius:50%;background:var(--vert)}
.nom.w i{background:var(--ambre);animation:pouls 1s infinite}.nom.p i{background:#b9c0d6}
.bulle{position:absolute;transform:translate(-50%,-100%);max-width:250px;padding:8px 12px;border-radius:14px 14px 14px 3px;background:#fff;color:#1b2036;font-size:12.5px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.35);animation:pop .25s ease-out}
@keyframes pop{from{opacity:0;transform:translate(-50%,-85%) scale(.8)}}
@keyframes pouls{50%{opacity:.25}}
header.titre{position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:max(12px,env(safe-area-inset-top,0px));pointer-events:none}
h1{font:600 clamp(21px,3.2vw,32px)/1 var(--titre);margin:0;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.55)}
.sous{color:#e8ecf7;font-size:12px;margin-top:4px;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.pan{position:fixed;background:var(--panneau);border:1px solid var(--trait);border-radius:18px;backdrop-filter:blur(8px)}
#fiche{right:max(14px,env(safe-area-inset-right,0px));top:max(12px,env(safe-area-inset-top,0px));width:330px;max-height:calc(100% - 24px);overflow:auto;padding:16px}
#chat{left:max(14px,env(safe-area-inset-left,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));width:380px;height:min(430px,60%);display:flex;flex-direction:column}
#onglets{display:none}
@media(max-width:820px){
  #fiche,#chat{left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));top:auto;bottom:calc(54px + env(safe-area-inset-bottom,0px));width:auto;height:44%;max-height:44%}
  body.vue-chat #fiche{display:none} body.vue-fiche #chat{display:none}
  #onglets{display:flex;position:fixed;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:max(8px,env(safe-area-inset-bottom,0px));gap:8px}
  #onglets button{flex:1}
}
h2{font:600 22px/1.1 var(--titre);margin:0 0 2px;color:var(--or-doux)}
h3{font:700 11px var(--texte);letter-spacing:1.5px;text-transform:uppercase;color:var(--gris);margin:14px 0 6px}
#fiche p{margin:0 0 8px;color:#d5d9e6}
.role{color:var(--gris);font-size:12.5px;margin-bottom:10px}
button{font:inherit;color:inherit}
.lien{all:unset;cursor:pointer;color:var(--gris);font-size:12px;margin-bottom:8px;display:inline-block}
.btn{all:unset;cursor:pointer;font-size:12.5px;font-weight:700;border:1px solid var(--or);color:var(--or-doux);padding:7px 13px;border-radius:30px;display:inline-block;text-align:center;box-sizing:border-box}
.btn.plein{background:var(--or);color:#1b1408}
.lien:focus-visible,.btn:focus-visible,.ligne:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--or);outline-offset:2px}
.chiffres{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chiffres div{background:rgba(13,19,34,.8);border-radius:12px;padding:9px 6px;text-align:center}
.chiffres b{display:block;font:600 25px/1 var(--titre);font-variant-numeric:tabular-nums}.chiffres span{font-size:10.5px;color:var(--gris)}
.ligne{all:unset;display:flex;align-items:center;gap:10px;width:100%;padding:6px 8px;border-radius:10px;cursor:pointer;box-sizing:border-box}
.ligne:hover{background:rgba(255,255,255,.05)}
.pastille{width:26px;height:26px;border-radius:50%;flex:none}
.ligne b{display:block;font-size:13.5px}.ligne small{color:var(--gris);font-size:11.5px}
.etat{margin-left:auto;font-size:10.5px;padding:2px 8px;border-radius:20px;border:1px solid var(--vert);color:var(--vert);white-space:nowrap}
.etat.w{border-color:var(--ambre);color:var(--ambre)}.etat.p{border-color:var(--gris);color:var(--gris)}
ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.fil li{display:flex;gap:10px;font-size:13px}.fil time{color:var(--gris);font-size:11.5px;flex:none;width:74px;font-variant-numeric:tabular-nums}
a{color:var(--or-doux)}
.note{color:var(--gris);font-size:11.5px;margin-top:8px}
.barre{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--trait)}
#chat select{flex:1;min-width:0;background:var(--nuit);color:var(--creme);border:1px solid var(--trait);border-radius:10px;padding:7px 8px;font:700 13px var(--texte)}
#msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.m{max-width:86%;padding:8px 11px;border-radius:14px;font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.m.moi{align-self:flex-end;background:var(--or);color:#1b1408;border-bottom-right-radius:4px}
.m.eux{align-self:flex-start;background:#222b49;border-bottom-left-radius:4px}
.m.eux b{display:block;font-size:11.5px;margin-bottom:2px}
.m.sys{align-self:center;background:none;color:var(--gris);font-size:12px;text-align:center}
#saisie{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--trait)}
#saisie textarea{flex:1;min-width:0;resize:none;height:40px;background:var(--nuit);color:var(--creme);border:1px solid var(--trait);border-radius:12px;padding:9px 11px;font:14px var(--texte)}
#cle{padding:12px;display:grid;gap:8px}
#cle input{background:var(--nuit);color:var(--creme);border:1px solid var(--trait);border-radius:10px;padding:9px 11px;font:14px var(--texte);min-width:0}
#aide{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(10px,env(safe-area-inset-bottom,0px));color:#e8ecf7;font-size:11.5px;pointer-events:none;text-shadow:0 1px 6px rgba(0,0,0,.6)}
@media(max-width:1180px){#aide{display:none}}
@media(prefers-reduced-motion:reduce){.bulle,.nom i{animation:none}}
</style>
</head>
<body class="vue-chat">
<canvas id="gl"></canvas>
<div id="hud"></div>
<header class="titre"><h1>Le Campus des Agents IA</h1><div class="sous" id="maj">Mi-Haven · French Business Club</div></header>
<section id="fiche" class="pan" aria-live="polite"></section>
<section id="chat" class="pan" aria-label="Discussion avec les agents">
  <div class="barre"><select id="canal" aria-label="Choisir la conversation"></select><button class="lien" id="oublier" style="margin:0" hidden>Oublier la clé</button></div>
  <div id="msgs"></div>
  <form id="cle" hidden>
    <label for="cle-in">Pour parler aux agents, colle ta clé API Claude. Elle reste enregistrée sur cet appareil seulement et n'est envoyée qu'à Anthropic.</label>
    <input id="cle-in" type="password" autocomplete="off" placeholder="sk-ant-…">
    <button class="btn plein" type="submit">Enregistrer la clé</button>
  </form>
  <form id="saisie"><textarea id="texte" placeholder="Écris au bureau…" aria-label="Ton message"></textarea><button class="btn plein" type="submit">Envoyer</button></form>
</section>
<nav id="onglets"><button class="btn" data-vue="chat">Discussion</button><button class="btn" data-vue="fiche">Équipe</button></nav>
<div id="aide">Glisse pour te déplacer · molette ou pincement pour zoomer · clique sur un agent</div>

  msgs.innerHTML = (h.length ? '' : '<div class="m sys">' + (canal === 'bureau' ? 'Écris à toute l\'équipe. Atlas répond en premier et passe la parole aux bons agents.' : 'Conversation privée avec ' + esc(PAR_ID[canal].nom) + '.') + '</div>') +
    h.map(m => m.de === 'moi' ? '<div class="m moi">' + esc(m.t) + '</div>' : m.de === 'sys' || !PAR_ID[m.de] ? '<div class="m sys">' + esc(m.t) + '</div>' : '<div class="m eux"><b style="color:' + hex(m.de === 'atlas' ? 0xb9c0d6 : PAR_ID[m.de].couleur) + '">' + esc(PAR_ID[m.de].nom) + '</b>' + esc(m.t) + '</div>').join('') + (attente ? '<div class="m sys">Ils écrivent…</div>' : '');
  msgs.scrollTop = msgs.scrollHeight; $('texte').placeholder = canal === 'bureau' ? 'Écris au bureau…' : 'Écris à ' + PAR_ID[canal].nom + '…'; }
function ouvrirCanal(c) { canal = c; canalSel.value = c; vue('chat'); affiche(); $('texte').focus(); }
canalSel.onchange = () => { canal = canalSel.value; affiche(); if (canal !== 'bureau') { const a = PAR_ID[canal]; if (choisi) choisi.halo.visible = false; choisi = a; a.halo.visible = true; view.suit = a; view.tzoom = 2.2; fiche(); } };
$('cle').onsubmit = e => { e.preventDefault(); const v = $('cle-in').value.trim(); if (v) { mem.set('bureau.cle', v); $('cle-in').value = ''; affiche(); } };

function contexte() { const R = data; return 'CONTEXTE. Julian Audibert dirige à Casablanca : Mi-Haven (conciergerie et gestion locative courte durée, 48 logements à Casablanca, Marrakech et El Jadida ; un logement vide est meublé et prêt en moins de 21 jours) et le French Business Club, FBC (soirées networking francophones « The Bridge AfterWork » à l\'Onomo Hotel City Center ; prochaine édition, la n°14, jeudi 26 novembre 2026, 300 MAD en prévente).\n' +
  'ÉQUIPE DU CAMPUS : ' + TEAM.filter(a => a.type !== 'chef').map(a => a.nom + ' (' + a.role + ', ' + a.mode.toLowerCase() + ')').join(' ; ') + '.\n' +
  'CE QUI TOURNE VRAIMENT : Réa publie seule des Reels sur @mihaven.ma (' + (R.ok ? R.jour + ' aujourd\'hui, ' + R.tout.length + ' au total, dernier format : ' + (R.tout[0] ? R.tout[0].nomFormat : 'aucun') : 'chiffres indisponibles') + ') ; Atlas a une routine qui passe 3 fois par jour sur les e-mails, les leads et les sponsors FBC et envoie un brief ; les réponses automatiques GESTION, SÉJOUR, INVITATION et PITCH sont en service. Les agents en conseil n\'ont accès à aucun outil.\n' +

  'STYLE : français simple, tutoiement, phrases courtes, 1 à 5 phrases sauf si Julian demande un texte complet. Nous sommes le ' + new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: 'Africa/Casablanca' }) + ', ' + hm(new Date()) + ' à Casablanca.'; }
const tours = h => h.filter(m => m.de !== 'sys').reduce((acc, m) => { const role = m.de === 'moi' ? 'user' : 'assistant', d = acc[acc.length - 1]; if (d && d.role === role) d.content += '\n' + m.c; else acc.push({ role, content: m.c }); return acc; }, []);

      const txt = await claude(sys, tours(h.slice(-14).map(m => ({ de: m.de, c: m.de === 'moi' ? m.t : JSON.stringify([{ id: m.de, texte: m.t }]) }))));

      const h2 = histo(c); rep.filter(x => x && PAR_ID[x.id] && x.texte).slice(0, 3).forEach((x, i) => { const s = String(x.texte), a = PAR_ID[x.id]; h2.push({ de: x.id, t: s }); a.appel = performance.now() + 30000; setTimeout(() => parle(a, court(s), 5000), i * 2600); }); garde(c, h2);
    } else { const a = PAR_ID[c];
      const sys = contexte() + '\n\nTU ES ' + a.nom.toUpperCase() + ', ' + a.role + ' sur le campus. Ta personnalité : ' + a.trait + ' Statut : ' + a.mode + '. Julian t\'écrit en message privé. Réponds en ton nom, à la première personne, sans préfixe.';
      const txt = await claude(sys, tours(h.slice(-16).map(m => ({ de: m.de, c: m.t }))));
      const h2 = histo(c); h2.push({ de: a.id, t: txt }); garde(c, h2); parle(a, court(txt), 5000); a.appel = performance.now() + 30000; }

  cible.ecrit = false; attente = false; if (canal === c) affiche(); fiche(); };
$('texte').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('saisie').requestSubmit(); } });

// ================= étiquettes, bulles, confettis
const plaques = Object.keys(ZONES).map(k => { const z = ZONES[k], d = document.createElement('button'); d.className = 'plaque' + (z.loisir ? ' loisir' : ''); d.innerHTML = '<i></i>' + esc(z.n); hud.appendChild(d);
  d.onclick = () => { choisir(null); view.tx = z.c[0]; view.tz = z.c[1]; view.tzoom = 2; }; return { d, p: new THREE.Vector3(z.c[0], .3, z.r[3] - .2) }; });
TEAM.forEach(a => { a.tag = document.createElement('div'); a.tag.className = 'nom'; a.tag.innerHTML = '<i></i>' + esc(a.nom); hud.appendChild(a.tag); });
let bulle = null;

const confettis = [];
function fete() { const a = PAR_ID.rea; parle(a, 'Publié sur @mihaven.ma !', 5000); for (let i = 0; i < 70; i++) { const m = new THREE.Mesh(new THREE.PlaneGeometry(.18, .11), new THREE.MeshBasicMaterial({ color: pick([0xf58a1f, 0xffffff, 0x9b5de5, 0x35c2c9, 0xf2bf1d]), side: THREE.DoubleSide })); m.position.set(a.g.position.x + rnd(-1, 1), 3, a.g.position.z + rnd(-1, 1)); m.userData = { vx: rnd(-2, 2), vy: rnd(3, 7), vz: rnd(-2, 2), r: rnd(-6, 6) }; scene.add(m); confettis.push(m); } }
function proj(v, el, dy) { const p = v.clone().project(cam); el.style.left = ((p.x + 1) / 2 * innerWidth) + 'px'; el.style.top = ((1 - p.y) / 2 * innerHeight + (dy || 0)) + 'px'; }

// ================= caméra et pointeur
function cadre() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); const haut = (w < 820 ? 86 : 54) / view.zoom, larg = haut * w / h; cam.left = -larg / 2; cam.right = larg / 2; cam.top = haut / 2; cam.bottom = -haut / 2; cam.updateProjectionMatrix(); }
addEventListener('resize', cadre);
const ray = new THREE.Raycaster(), souris = new THREE.Vector2(); let glisse = null, pts = {};
function vise(e) { souris.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(souris, cam); const h = ray.intersectObjects(TEAM.map(a => a.g), true)[0]; return h ? h.object.userData.agent : null; }
canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); pts[e.pointerId] = [e.clientX, e.clientY]; glisse = { x: e.clientX, y: e.clientY, d: 0, pin: 0 }; });
canvas.addEventListener('pointermove', e => { if (!glisse) { canvas.classList.toggle('main', !!vise(e)); return; } const ids = Object.keys(pts);
  if (ids.length === 2) { pts[e.pointerId] = [e.clientX, e.clientY]; const a = pts[ids[0]], b = pts[ids[1]], d = Math.hypot(a[0] - b[0], a[1] - b[1]); if (glisse.pin) view.tzoom = Math.max(.6, Math.min(4, view.tzoom * d / glisse.pin)); glisse.pin = d; glisse.d = 99; return; }

function fin(e) { delete pts[e.pointerId]; if (glisse && glisse.d <= 6) { const a = vise(e); if (a) choisir(a); } if (!Object.keys(pts).length) glisse = null; else glisse.pin = 0; }
canvas.addEventListener('pointerup', fin); canvas.addEventListener('pointercancel', fin);
canvas.addEventListener('wheel', e => { e.preventDefault(); view.tzoom = Math.max(.6, Math.min(4, view.tzoom * (e.deltaY < 0 ? 1.12 : .89))); }, { passive: false });

// ================= boucle
let avant = performance.now(), tBulle = 4, tEcran = 0, tHeure = 0;
function lumiere() { const h = +new Date().toLocaleTimeString('en-GB', { hour: '2-digit', hour12: false, timeZone: 'Africa/Casablanca' }), nuit = h < 7 || h >= 19;
  scene.background = new THREE.Color(nuit ? 0x1b2440 : 0xcfd9ee); hemi.intensity = nuit ? .42 : .7; sun.intensity = nuit ? .28 : .75; sun.color.set(nuit ? 0x9fb4ff : 0xfff2dc); }
function tick(now) { const dt = Math.min(.05, (now - avant) / 1000); avant = now; const S = now / 1000, W = reaTravaille(), OPS = opsEnPassage();
  for (const a of TEAM) { a.t -= dt; const occupe = a.ecrit || now < a.appel || (a.type === 'reels' && W) || (a.type === 'ops' && OPS);
    if (occupe) auPoste(a, true);
    else if (a.etat === 'poste' && a.t < 0) { a.type === 'chef' || a.type === 'ops' ? (Math.random() < .6 ? visite(a) : enPause(a)) : enPause(a); a.t = a.type === 'auto' ? rnd(14, 24) : rnd(22, 45); }
    else if (a.etat === 'pause' && a.t < 0) { if (a.type === 'auto' || a.type === 'ops') { auPoste(a); a.t = rnd(40, 100); } else { Math.random() < .25 ? auPoste(a) : enPause(a); a.t = rnd(22, 45); } }
    if (a.etat === 'marche') { const c = a.chemin[0], dx = c[0] - a.g.position.x, dz = c[1] - a.g.position.z, d = Math.hypot(dx, dz), pas = a.vitesse * dt;
      if (d <= pas) { a.g.position.x = c[0]; a.g.position.z = c[1]; a.chemin.shift(); if (!a.chemin.length) { a.etat = a.apres; a.assis = !!a.arrivee.assis; a.g.rotation.y = a.arrivee.f || 0; a.tasse.visible = !!a.arrivee.tasse; } }
      else { a.g.position.x += dx / d * pas; a.g.position.z += dz / d * pas; let r = Math.atan2(dx, dz) - a.g.rotation.y; r = Math.atan2(Math.sin(r), Math.cos(r)); a.g.rotation.y += r * Math.min(1, dt * 10); } }
    const m = a.etat === 'marche', w = Math.sin((S + a.ph) * (a.vitesse > 3 ? 14 : 9)), tape = a.etat === 'poste' && (a.ecrit || (a.type === 'reels' && W) || (a.type === 'ops' && OPS) || a.type === 'auto'), act = a.etat === 'pause' && a.spot ? a.spot.act : null;
    let b0 = 0, b1 = 0, z0 = 0, z1 = 0;
    if (m) { b0 = -w * .6; b1 = w * .6; } else if (tape) { b0 = -1.1 + Math.sin(S * 13 + a.ph) * .12; b1 = -1.1 + Math.cos(S * 11 + a.ph) * .12; }
    else if (act === 'baby') { b0 = -1.2 + Math.sin(S * 9 + a.ph) * .25; b1 = -1.2 + Math.cos(S * 7 + a.ph) * .25; }
    else if (act === 'ping') { b1 = -1.3 + Math.sin(S * 6 + a.ph) * .7; }
    else if (act === 'yoga') { b0 = b1 = -2.9 + Math.sin(S * .8 + a.ph) * .2; z0 = -.3; z1 = .3; }
    else if (act === 'pitch') { b0 = -.6 + Math.sin(S * 2.2) * .5; b1 = -.9 + Math.cos(S * 1.7) * .5; }

    a.corps.position.y = (a.assis ? -.12 : 0) + (m ? Math.abs(w) * .08 : Math.sin(S * 2 + a.ph) * .015); a.jambes.forEach(j => j.position.y = a.assis ? .6 : .5);
    const e = etatDe(a); a.tag.className = 'nom ' + e[0]; proj(a.g.position.clone().setY(2.85), a.tag); }
  const jeu = pingA.pris && pingB.pris && pingA.pris.etat === 'pause' && pingB.pris.etat === 'pause'; balle.visible = !!jeu; if (jeu) { const u = (Math.sin(S * 6) + 1) / 2; balle.position.set(-13.4 + u * 3.8, 1.25 + Math.abs(Math.sin(S * 6)) * .5, 16 + Math.sin(S * 2.3) * .5); }
  tEcran -= dt; if (tEcran < 0) { tEcran = .35; for (const a of TEAM) { const p = POSTES[a.id]; if (!p.ecran) continue; const la = a.etat === 'poste';
      peint(p.ecran, !la ? 'veille' : a.ecrit ? 'ecrit' : a.type === 'reels' && W ? 'rendu' : 'tableau', a.type === 'reels' && W ? (S % 24) / 24 : (S * .2 + a.ph) % 1); } }
  tBulle -= dt; if (tBulle < 0) { tBulle = rnd(6, 11); if (!bulle) { const a = pick(TEAM.filter(x => x.etat !== 'marche')); if (a) parle(a, pick(a.etat === 'poste' ? a.dit.travail : a.dit.pause)); } }
  if (bulle) { if (now > bulle.fin) { bulle.d.remove(); bulle = null; } else proj(bulle.a.g.position.clone().setY(3.2), bulle.d, -18); }
  for (let i = confettis.length - 1; i >= 0; i--) { const c = confettis[i], u = c.userData; u.vy -= 9 * dt; c.position.x += u.vx * dt; c.position.y += u.vy * dt; c.position.z += u.vz * dt; c.rotation.x += u.r * dt; c.rotation.z += u.r * dt; if (c.position.y < 0) { scene.remove(c); confettis.splice(i, 1); } }

  const k = Math.min(1, dt * 4); view.x += (view.tx - view.x) * k; view.z += (view.tz - view.z) * k; if (Math.abs(view.tzoom - view.zoom) > .001) { view.zoom += (view.tzoom - view.zoom) * k; cadre(); }

cadre(); lumiere(); fiche(); affiche(); maj(); majRun(); setInterval(maj, 75000); setInterval(majRun, 180000); setInterval(() => { if (choisi) fiche(); }, 5000); requestAnimationFrame(tick);
