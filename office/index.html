<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Le Bureau des Agents IA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Une scène 3D plein écran ; la fiche (équipe ou agent) flotte à droite, ou en tiroir bas sur téléphone. */
:root{--nuit:#0d1322;--panneau:rgba(19,26,46,.94);--trait:#2c3558;--or:#c9a35c;--or-doux:#e9d3a3;--creme:#f3ece0;--gris:#9aa3bd;
  --vert:#5fcf96;--ambre:#f0b352;--titre:"Cormorant Garamond",Georgia,serif;--texte:"DM Sans",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--nuit);color:var(--creme);font:14.5px/1.45 var(--texte)}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl.main{cursor:pointer}
#hud{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.plaque{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;border:1px solid var(--or);background:rgba(17,24,48,.92);color:var(--or-doux);
  font:600 13px var(--titre);letter-spacing:2.5px;text-transform:uppercase;padding:4px 14px;border-radius:30px;white-space:nowrap}
.plaque.vide{border-style:dashed;color:var(--gris);border-color:var(--gris)}
.nom{position:absolute;transform:translate(-50%,-100%);display:flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:20px;background:rgba(13,19,34,.85);
  font-size:12px;font-weight:700;white-space:nowrap}
.nom i{width:7px;height:7px;border-radius:50%;background:var(--vert)}
.nom.w i{background:var(--ambre);animation:pouls 1s infinite}
.nom.p i{background:var(--gris)}
.bulle{position:absolute;transform:translate(-50%,-100%);max-width:230px;padding:8px 12px;border-radius:14px 14px 14px 3px;background:var(--creme);color:#1b2036;
  font-size:12.5px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:pop .25s ease-out}
@keyframes pop{from{opacity:0;transform:translate(-50%,-85%) scale(.8)}}
@keyframes pouls{50%{opacity:.25}}
header{position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:max(12px,env(safe-area-inset-top,0px));pointer-events:none}
h1{font:600 clamp(22px,3.4vw,34px)/1 var(--titre);margin:0;color:var(--or-doux);letter-spacing:.5px;text-shadow:0 2px 14px rgba(0,0,0,.6)}
.sous{color:var(--gris);font-size:12px;margin-top:4px}
#fiche{position:fixed;right:max(14px,env(safe-area-inset-right,0px));top:max(12px,env(safe-area-inset-top,0px));width:340px;max-height:calc(100% - 24px);overflow:auto;
  background:var(--panneau);border:1px solid var(--trait);border-radius:18px;padding:16px;backdrop-filter:blur(8px)}
@media(max-width:820px){#fiche{left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));top:auto;bottom:max(10px,env(safe-area-inset-bottom,0px));width:auto;max-height:44%}}
#fiche h2{font:600 23px/1.1 var(--titre);margin:0 0 2px;color:var(--or-doux)}
#fiche h3{font:700 11px var(--texte);letter-spacing:1.5px;text-transform:uppercase;color:var(--gris);margin:14px 0 6px}
#fiche p{margin:0 0 8px;color:#d5d9e6}
.role{color:var(--gris);font-size:12.5px;margin-bottom:10px}
.retour{all:unset;cursor:pointer;color:var(--gris);font-size:12px;margin-bottom:8px;display:inline-block}
.retour:focus-visible,.ligne:focus-visible,.btn:focus-visible{outline:2px solid var(--or);outline-offset:2px}
.chiffres{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chiffres div{background:rgba(13,19,34,.8);border-radius:12px;padding:9px 6px;text-align:center}
.chiffres b{display:block;font:600 26px/1 var(--titre);font-variant-numeric:tabular-nums}
.chiffres span{font-size:10.5px;color:var(--gris)}
.ligne{all:unset;display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;border-radius:10px;cursor:pointer;box-sizing:border-box}
.ligne:hover{background:rgba(255,255,255,.05)}
.pastille{width:30px;height:30px;border-radius:50%;flex:none;border:2px solid var(--or)}
.ligne b{display:block;font-size:13.5px}.ligne small{color:var(--gris);font-size:11.5px}
.etat{margin-left:auto;font-size:11px;padding:2px 9px;border-radius:20px;border:1px solid var(--vert);color:var(--vert);white-space:nowrap}
.etat.w{border-color:var(--ambre);color:var(--ambre)}.etat.p{border-color:var(--gris);color:var(--gris)}
ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.fil li{display:flex;gap:10px;font-size:13px}.fil time{color:var(--gris);font-size:11.5px;flex:none;width:74px;font-variant-numeric:tabular-nums}
a{color:var(--or-doux)}
.tag{display:inline-block;font-size:11px;padding:2px 9px;border-radius:30px;border:1px solid var(--trait);color:var(--gris);margin:0 4px 4px 0}
.barres{display:grid;gap:5px}.barres div{display:grid;grid-template-columns:120px 1fr 22px;gap:8px;align-items:center;font-size:12px}
.barres i{height:7px;border-radius:4px;background:var(--or);display:block}
.btn{all:unset;cursor:pointer;font-size:12px;font-weight:700;border:1px solid var(--or);color:var(--or-doux);padding:6px 12px;border-radius:30px;margin-top:10px;display:inline-block}
.note{color:var(--gris);font-size:11.5px;margin-top:8px}
#aide{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));color:var(--gris);font-size:11.5px;pointer-events:none}
@media(max-width:820px){#aide{display:none}}
@media(prefers-reduced-motion:reduce){.bulle,.nom i{animation:none}}
</style>
</head>
