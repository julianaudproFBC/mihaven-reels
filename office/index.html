<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Le Campus des Agents IA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Scène 3D plein écran ; fiche à droite, discussion en bas à gauche ; sur téléphone, un seul panneau à la fois en bas. */
:root{--nuit:#f3eee3;--panneau:rgba(252,249,243,.96);--trait:#ded7c8;--or:#17171b;--or-doux:#17171b;--creme:#1d1c22;--gris:#77705f;--vert:#2f9d68;--ambre:#c9801c;
  --titre:"Cormorant Garamond",Georgia,serif;--texte:"DM Sans",system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#e9e3d6;color:var(--creme);font:14.5px/1.45 var(--texte)}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl.main{cursor:pointer}
#hud{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.plaque{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:6px;background:rgba(20,24,34,.88);color:#fff;
  font:700 12px var(--texte);padding:4px 11px 4px 9px;border-radius:30px;white-space:nowrap;border:0}
.plaque i{width:7px;height:7px;border-radius:50%;background:var(--vert)}
.plaque.loisir{background:rgba(255,255,255,.85);color:#27324d}.plaque.loisir i{display:none}
.nom{position:absolute;transform:translate(-50%,-100%);display:flex;align-items:center;gap:5px;padding:2px 9px 2px 7px;border-radius:20px;background:rgba(13,19,34,.82);font-size:11.5px;font-weight:700;white-space:nowrap}
.nom i{width:7px;height:7px;border-radius:50%;background:var(--vert)}
.nom.w i{background:var(--ambre);animation:pouls 1s infinite}.nom.p i{background:#b9c0d6}
.bulle{position:absolute;transform:translate(-50%,-100%);max-width:250px;padding:8px 12px;border-radius:14px 14px 14px 3px;background:#fff;color:#1b2036;font-size:12.5px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.35);animation:pop .25s ease-out}
@keyframes pop{from{opacity:0;transform:translate(-50%,-85%) scale(.8)}}
@keyframes pouls{50%{opacity:.25}}
header.titre{position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:max(12px,env(safe-area-inset-top,0px));pointer-events:none}
h1{font:600 clamp(21px,3.2vw,32px)/1 var(--titre);margin:0;color:#17171b;letter-spacing:1px;text-transform:uppercase}
.sous{color:#5f5a4d;font-size:12px;margin-top:4px}
.pan{position:fixed;background:var(--panneau);border:1px solid var(--trait);border-radius:18px;backdrop-filter:blur(8px);box-shadow:0 18px 50px rgba(60,50,30,.16)}
#fiche{right:max(14px,env(safe-area-inset-right,0px));top:max(12px,env(safe-area-inset-top,0px));width:330px;max-height:calc(100% - 24px);overflow:auto;padding:16px}
#chat{left:max(14px,env(safe-area-inset-left,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));width:380px;height:min(430px,60%);display:flex;flex-direction:column}
#onglets{display:none}
@media(max-width:820px){
  #fiche,#chat{left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));top:auto;bottom:calc(54px + env(safe-area-inset-bottom,0px));width:auto;height:44%;max-height:44%}
  body.vue-chat #fiche{display:none} body.vue-fiche #chat{display:none}
  #onglets{display:flex;position:fixed;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:max(8px,env(safe-area-inset-bottom,0px));gap:8px}
  #onglets button{flex:1}
}
h2{font:600 24px/1.1 var(--titre);margin:0 0 2px;color:var(--or-doux);letter-spacing:.3px}
h3{font:700 11px var(--texte);letter-spacing:1.5px;text-transform:uppercase;color:var(--gris);margin:14px 0 6px}
#fiche p{margin:0 0 8px;color:#3d3a33}
.role{color:var(--gris);font-size:12.5px;margin-bottom:10px}
button{font:inherit;color:inherit}
.lien{all:unset;cursor:pointer;color:var(--gris);font-size:12px;margin-bottom:8px;display:inline-block}
.btn{all:unset;cursor:pointer;font-size:12.5px;font-weight:700;border:1px solid var(--or);color:var(--or-doux);padding:7px 13px;border-radius:30px;display:inline-block;text-align:center;box-sizing:border-box}
.btn.plein{background:var(--or);color:#fff}
.lien:focus-visible,.btn:focus-visible,.ligne:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--or);outline-offset:2px}
.chiffres{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chiffres div{background:#f0eadd;border-radius:12px;padding:9px 6px;text-align:center}
.chiffres b{display:block;font:600 25px/1 var(--titre);font-variant-numeric:tabular-nums}.chiffres span{font-size:10.5px;color:var(--gris)}
.ligne{all:unset;display:flex;align-items:center;gap:10px;width:100%;padding:6px 8px;border-radius:10px;cursor:pointer;box-sizing:border-box}
.ligne:hover{background:rgba(0,0,0,.05)}
.pastille{width:26px;height:26px;border-radius:50%;flex:none}
.ligne b{display:block;font-size:13.5px}.ligne small{color:var(--gris);font-size:11.5px}
.etat{margin-left:auto;font-size:10.5px;padding:2px 8px;border-radius:20px;border:1px solid var(--vert);color:var(--vert);white-space:nowrap}
.etat.w{border-color:var(--ambre);color:var(--ambre)}.etat.p{border-color:var(--gris);color:var(--gris)}
ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.fil li{display:flex;gap:10px;font-size:13px}.fil time{color:var(--gris);font-size:11.5px;flex:none;width:74px;font-variant-numeric:tabular-nums}
a{color:#7a4a12}
.note{color:var(--gris);font-size:11.5px;margin-top:8px}
.barre{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--trait)}
#chat select{flex:1;min-width:0;background:var(--nuit);color:var(--creme);border:1px solid var(--trait);border-radius:10px;padding:7px 8px;font:700 13px var(--texte)}
#msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.m{max-width:86%;padding:8px 11px;border-radius:14px;font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.m.moi{align-self:flex-end;background:var(--or);color:#fff;border-bottom-right-radius:4px}
.m.eux{align-self:flex-start;background:#efe8da;border-bottom-left-radius:4px}
.m.eux b{display:block;font-size:11.5px;margin-bottom:2px}
.m.sys{align-self:center;background:none;color:var(--gris);font-size:12px;text-align:center}
#saisie{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--trait)}
#saisie textarea{flex:1;min-width:0;resize:none;height:40px;background:var(--nuit);color:var(--creme);border:1px solid var(--trait);border-radius:12px;padding:9px 11px;font:14px var(--texte)}
#cle{padding:12px;display:grid;gap:8px}
#cle input{background:var(--nuit);color:var(--creme);border:1px solid var(--trait);border-radius:10px;padding:9px 11px;font:14px var(--texte);min-width:0}
#aide{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(10px,env(safe-area-inset-bottom,0px));color:#5f5a4d;font-size:11.5px;pointer-events:none}
@media(max-width:1180px){#aide{display:none}}
@media(prefers-reduced-motion:reduce){.bulle,.nom i{animation:none}}

#fiche{transition:width .25s ease}
#fiche.large{width:400px}
@media(max-width:820px){#fiche.large{width:auto}}
#jeu{position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:calc(max(12px,env(safe-area-inset-top,0px)) + 86px);display:flex;gap:8px;flex-wrap:wrap;max-width:340px}
#jeu .btn{background:var(--panneau);font-size:12px;padding:6px 12px}
#jeu .btn.actif{background:var(--or);color:#fff}
#indice{position:fixed;left:50%;bottom:calc(max(18px,env(safe-area-inset-bottom,0px)) + 8px);transform:translateX(-50%);background:#17171b;color:#fff;font-weight:700;font-size:13px;padding:9px 16px;border-radius:30px;border:0;cursor:pointer;z-index:5}
#toasts{position:fixed;left:50%;top:max(14px,env(safe-area-inset-top,0px));transform:translateX(-50%);display:grid;gap:8px;z-index:6;pointer-events:none}
.toast{background:#17171b;color:#fff;font-weight:700;font-size:13px;padding:9px 16px;border-radius:30px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:pop .25s ease-out}

#croix button{border:1px solid var(--trait);background:var(--panneau);border-radius:14px;font-size:20px;font-weight:700;touch-action:none}
#croix button:nth-child(1){grid-column:2}#croix button:nth-child(2){grid-column:1;grid-row:2}#croix button:nth-child(3){grid-column:2;grid-row:2}#croix button:nth-child(4){grid-column:3;grid-row:2}

.niv{font-style:normal;font-size:10px;font-weight:700;background:var(--or);color:#fff;border-radius:10px;padding:1px 6px;margin-left:2px}
.xp{height:8px;border-radius:5px;background:#e6dfd0;overflow:hidden;margin:6px 0 10px}.xp i{display:block;height:100%;background:linear-gradient(90deg,#c9801c,#e9b44c);border-radius:5px;transition:width .6s ease}
.tete{display:flex;gap:12px;align-items:center;margin-bottom:8px}.tete .rond{width:54px;height:54px;border-radius:50%;flex:none;box-shadow:inset 0 -8px 0 rgba(0,0,0,.12)}
.rapides{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}.rapides .btn{font-size:12px;padding:6px 11px;font-weight:500}

.jr li{font-size:12.5px;border-left:3px solid var(--trait);padding-left:8px}.jr time{color:var(--gris);font-size:11px;display:block}
#salle-choix{position:fixed;inset:0;background:rgba(30,26,18,.35);display:grid;place-items:center;z-index:8;padding:16px}
#salle-choix form{background:#fcf9f3;border:1px solid var(--trait);border-radius:18px;padding:18px;width:min(380px,100%);max-height:90%;overflow:auto}
#salle-choix label{display:flex;gap:8px;align-items:center;padding:5px 0;font-size:14px}
.nom{color:#fff}
body.nuit h1{color:#fff}body.nuit .sous,body.nuit #aide{color:#d9dcea}
body.pov #fiche{display:none}
body.pov #chat{height:230px;opacity:.94}
</style>
